spring:
  application:
    name: funds

  # Master data / auxiliary tables (fund catalogue).
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/funds}
    username: ${DB_USERNAME:funds}
    password: ${DB_PASSWORD:funds}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  # Transactional / critical data, on 27018 so a natively installed mongod can keep the
  # default port.
  #
  # The connection URI belongs under `spring.mongodb`, NOT `spring.data.mongodb`: Spring
  # Boot 4 split them, leaving only Spring Data settings under the latter. Putting it in
  # the wrong place is silently ignored and the driver falls back to localhost:27017 —
  # which, on a machine running a second MongoDB, means connecting to the wrong database
  # rather than failing.
  #
  # `directConnection=true` is required, not cosmetic: the containerised replica set
  # advertises its member as localhost:27017, so a driver doing topology discovery would
  # connect here and then redirect itself to 27017. Direct connection pins it.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/funds?directConnection=true}

  data:
    mongodb:
      auto-index-creation: false

server:
  port: ${SERVER_PORT:8080}

# Application-specific settings.
app:
  client:
    # Business rule: every client starts with COP $500.000.
    initial-balance: 500000
  currency: COP
  idempotency:
    # How long a completed idempotency record stays replayable.
    retention: 24h
    # A reservation older than this is considered abandoned by a crashed instance.
    lease: 30s
  # Kafka is wired through reactor-kafka directly rather than Spring Kafka's Boot
  # auto-configuration, so the connection settings live here instead of under
  # spring.kafka. Serializers, acks and idempotence are set explicitly in KafkaConfig.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer-group-id: ${KAFKA_GROUP_ID:funds}
    topics:
      subscription-notifications: ${KAFKA_TOPIC_NOTIFICATIONS:funds.subscription.notifications}
  outbox:
    relay:
      # Fixed delay between outbox polling cycles.
      interval: 2s
      batch-size: 100
  security:
    jwt:
      # HS256 signing key. MUST be overridden in every non-local environment.
      # Minimum 256 bits (32 characters) or Nimbus rejects it.
      secret: ${JWT_SECRET:local-development-only-secret-key-change-me-32b}
      issuer: ${JWT_ISSUER:yam-funds}
      ttl: 1h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      # Retries writes that lost the optimistic-locking race on the client document.
      # Must name the domain exception, not Spring's: the persistence adapter translates
      # OptimisticLockingFailureException at the boundary, so by the time the retry sees
      # the failure it is already a ConcurrentAggregateUpdateException.
      clientBalanceUpdate:
        base-config: default
        max-attempts: 4
        wait-duration: 50ms
        retry-exceptions:
          - com.yam.funds.domain.exception.ConcurrentAggregateUpdateException
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    root: INFO
    com.yam.funds: ${LOG_LEVEL:DEBUG}
