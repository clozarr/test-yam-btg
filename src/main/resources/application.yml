spring:
  application:
    name: funds

  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/funds}
    username: ${DB_USERNAME:funds}
    password: ${DB_PASSWORD:funds}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_GROUP_ID:funds}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${SERVER_PORT:8080}

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    # Override with a local endpoint (e.g. http://localhost:8000) when running against DynamoDB Local.
    endpoint: ${DYNAMODB_ENDPOINT:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    root: INFO
    com.yam.funds: ${LOG_LEVEL:DEBUG}
