# Local development dependencies for the YAM Funds service.
#
# Requires Docker Compose v2 (`docker compose up -d`). The obsolete top-level
# `version:` key is intentionally omitted.
#
# The application is expected to run on the host (`./gradlew bootRun`), so every
# service advertises itself on localhost.

name: yam-funds

services:

  # MongoDB must run as a replica set: multi-document transactions (used by the
  # subscription flow to write the client, the ledger entry and the outbox event
  # atomically) are rejected on a standalone server. A single-node replica set is
  # enough locally. The healthcheck initiates it on first start and is idempotent.
  mongodb:
    # 8.2, not 8.0: MongoDB refuses to start on Linux kernels 6.19 and newer
    # (SERVER-121912), and recent Docker Desktop ships a 7.x kernel in its VM.
    # The 8.0 line still fails there; 8.2 carries the fix.
    image: mongo:8.2
    container_name: yam-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Published on 27018 so a natively installed mongod can keep 27017. The container
      # still listens on 27017 internally, which is also the host the replica set
      # advertises — see the note on directConnection in application.yml.
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok
          }
        "
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: yam-postgres
    environment:
      POSTGRES_DB: funds
      POSTGRES_USER: funds
      POSTGRES_PASSWORD: funds
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 expects the mount one level up, at /var/lib/postgresql, and places
      # the cluster in a version-specific subdirectory. Mounting the old
      # /var/lib/postgresql/data path makes the image refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funds -d funds"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka in KRaft mode: no ZooKeeper. Two listeners are declared so the broker can
  # be reached both from inside the compose network (BROKER) and from the host
  # where the application runs (HOST).
  kafka:
    image: apache/kafka:4.3.1
    container_name: yam-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: BROKER://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: yam-funds-local-cluster
      # Must be set, and must match where the volume is mounted. Left unset, the
      # image writes to /tmp inside the container: the broker works, the volume
      # sits empty, and every recreate silently discards the whole log.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Web UI for inspecting topics, messages and consumer groups.
  #
  # Behind the "tools" profile, so `docker compose up -d` does not start it:
  #
  #     docker compose --profile tools up -d console      # http://localhost:8081
  #
  # It is a reader. Browsing a topic here uses a throwaway consumer group and
  # does not commit offsets for the application's own group, so it cannot steal
  # notifications from the running service.
  console:
    image: redpandadata/console:v3.9.0
    container_name: yam-kafka-console
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 8081 on the host: the application already owns 8080.
      - "8081:8080"
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./docker/kafka-console.yaml:/etc/console/config.yaml:ro

volumes:
  mongodb-data:
  postgres-data:
  kafka-data:
